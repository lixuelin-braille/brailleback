// Top-level build file. Modernized for AGP 9.2.0 + Gradle 9.4.1 (Alibaba mirrors).
plugins {
    // 版本全部来自 gradle/libs.versions.toml，这里不再出现数字。
    alias(libs.plugins.android.application) apply false
    alias(libs.plugins.android.library) apply false
    // Compose 编译器插件版本必须与 AGP 9.2 内置的 Kotlin 严格一致（见 toml 注释）。
    alias(libs.plugins.kotlin.compose) apply false
}

allprojects {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// ── detekt：只拦新增债务 ────────────────────────────────────────────────
// 不引 detekt 的 Gradle 插件（1.23 的插件面向 Gradle 8 API，Gradle 9 上有兼容风险），
// 直接用 detekt-cli 跑 JavaExec。依赖已在离线缓存里（tools/dependency-probe 拉的）。
configurations {
    detektCli
}

dependencies {
    detektCli libs.detekt.cli
}

def detektInputs = [
    "$rootDir/brailleback/src",
    "$rootDir/service/src",
    "$rootDir/client/src",
    "$rootDir/libraries/utils/src",
    "$rootDir/libraries/compatutils/src",
]

tasks.register('detektCheck', JavaExec) {
    group = 'verification'
    description = '扫主模块与服务，只报 baseline 之外的新问题；有新问题则失败'
    classpath = configurations.detektCli
    mainClass = 'io.gitlab.arturbosch.detekt.cli.Main'
    args = [
        '--config', "$rootDir/config/detekt/detekt.yml",
        '--baseline', "$rootDir/config/detekt/baseline.xml",
        '--build-upon-default-config',
        '--input', detektInputs.join(','),
        '--excludes', '**/build/**,**/jni/**,**/*Test.kt',
    ]
}

tasks.register('detektBaseline', JavaExec) {
    group = 'verification'
    description = '重新生成 baseline（把当前所有问题冻结成基线）'
    classpath = configurations.detektCli
    mainClass = 'io.gitlab.arturbosch.detekt.cli.Main'
    args = [
        '--config', "$rootDir/config/detekt/detekt.yml",
        '--baseline', "$rootDir/config/detekt/baseline.xml",
        '--build-upon-default-config',
        '--create-baseline',
        '--input', detektInputs.join(','),
        '--excludes', '**/build/**,**/jni/**,**/*Test.kt',
    ]
}