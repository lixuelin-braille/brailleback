#
# 全仓依赖与 SDK 版本的唯一来源。
#
# 规矩：
#   1. 模块 build.gradle 里不再写死 "group:artifact:version" 字符串，一律引用 libs.*；
#   2. 升级只改 [versions] 一处；
#   3. 现存版本组合来自本机离线缓存实测（见 docs/20-依赖与镜像.md）。离线构建下
#      缓存里没有的版本一改就断，升级前先用 tools/dependency-probe 确认；
#   4. compileSdk / targetSdk / minSdk 也放这里，11 个模块统一引用。
#

[versions]
agp = "9.2.0"
# Compose 编译器插件必须与 AGP 9.2 内置的 Kotlin 严格同版，不要单方面升级。
kotlinCompose = "2.2.10"

android-compileSdk = "37"
android-targetSdk = "37"
# 2026-11-18 从 23（Android 6.0，2015）抬到 29（Android 10）。
# 理由：23 那一代设备已无维护意义，抬到 29 后大量 SDK_INT 分支变成死代码可删，
# 维护面从 15 个系统版本收敛到 9 个；29 仍是校内/老点显器用户能覆盖的下限。
android-minSdk = "29"

# 刻意不引 Compose BOM：离线构建时 BOM 解析会失败，逐个写死更可控。
compose = "1.7.6"
activityCompose = "1.9.3"
material3 = "1.3.1"

# 声明 1.9.0 只是下限备忘，实际解析到 1.13.1（activity-compose 1.9.3 传递上去的）。
core = "1.9.0"
appcompat = "1.6.1"
preference = "1.2.1"
annotation = "1.8.1"
material = "1.11.0"

# 1.7.3 有 Dispatchers.Main 的 Looper 边界与 StateFlow 并发 emit 的已知问题，全仓统一抬到 1.9.0。
coroutines = "1.9.0"
timber = "5.0.1"

junit = "4.13.2"
androidxTestCore = "1.5.0"
androidxTestRunner = "1.5.2"
androidxTestRules = "1.5.0"
androidxTestExtJunit = "1.1.5"
uiautomator = "2.3.0"

guava = "32.0.1-jre"
gson = "2.11.0"
errorprone = "2.27.0"
autovalue = "1.11.0"

detekt = "1.23.7"

[libraries]
androidx-core = { module = "androidx.core:core", version.ref = "core" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-preference-ktx = { module = "androidx.preference:preference-ktx", version.ref = "preference" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "annotation" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "compose" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core", version.ref = "compose" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }

kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }
material = { module = "com.google.android.material:material", version.ref = "material" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
errorprone-annotations = { module = "com.google.errorprone:error_prone_annotations", version.ref = "errorprone" }
autovalue = { module = "com.google.auto.value:auto-value", version.ref = "autovalue" }
autovalue-annotations = { module = "com.google.auto.value:auto-value-annotations", version.ref = "autovalue" }

junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidxTestRules" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }

detekt-cli = { module = "io.gitlab.arturbosch.detekt:detekt-cli", version.ref = "detekt" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlinCompose" }
