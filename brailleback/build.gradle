apply plugin: 'com.android.application'

android {
    compileSdk 35
    buildFeatures {
        buildConfig = true
    }
    namespace 'com.googlecode.eyesfree.brailleback'

    defaultConfig {
        applicationId "com.googlecode.eyesfree.brailleback"
        minSdk 23
        targetSdk 35
        versionCode 33
        versionName "0.98.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }
    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            kotlin.srcDirs = ['src']
            resources.srcDirs = ['src']
            aidl.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
        test {
            java.srcDirs = ['test/java']
            kotlin.srcDirs = ['test/kotlin']
            resources.srcDirs = ['test/resources']
        }
        debug.setRoot('build-types/debug')
        release.setRoot('build-types/release')
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':client')
    implementation project(':service')
    implementation project(':libraries:utils')
    implementation project(':libraries:compatutils')
    // 只用到 androidx.core 的 AccessibilityNodeInfoCompat。
    // 原 legacy-support-v4 会额外拖入 androidx.media 整包，已摘除。
    // 版本必须锁 1.9.0：这是 appcompat:1.6.1 / preference-ktx:1.2.1 传递解析出的最高版本，
    // 显式声明更高的（如 1.13.1）会把整个依赖图的 core 一起抬上去，实测反而 +0.87MB。
    implementation 'androidx.core:core:1.9.0'
    // 设置页框架迁移（step 1）：androidx.preference + appcompat
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    testImplementation 'junit:junit:4.13.2'
}

