apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

// Version lives in the root gradle.properties only (see VersionCatalogTest).
// providers.gradleProperty() keeps configuration-cache compatibility.
def appVersionCode = providers.gradleProperty('appVersionCode').get().toInteger()
def appVersionName = providers.gradleProperty('appVersionName').get()

// 正式签名的 keystore 放在仓库根的 keystore.properties（不进版本库，见 .gitignore）。
// 文件不存在时，release 仍按原来的方式用 debug 签名，构建不会因为缺密钥而失败。
def keystorePropertiesFile = rootProject.file('keystore.properties')
def hasReleaseKey = keystorePropertiesFile.exists()
def keystoreProperties = new Properties()
if (hasReleaseKey) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    compileSdk 35
    if (hasReleaseKey) {
        signingConfigs {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildFeatures {
        buildConfig = true
        compose = true
    }
    namespace 'com.googlecode.eyesfree.brailleback'

    defaultConfig {
        applicationId "com.googlecode.eyesfree.brailleback"
        minSdk 23
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // 诊断包专用：把日志级别硬编码进 APK，设置页与偏好项都改不动它。
        // 正常构建为 -1（不生效）；出诊断包用 -PdiagLogLevel=3（DEBUG）。
        buildConfigField "int", "DIAG_LOG_LEVEL",
                (project.findProperty("diagLogLevel") ?: "-1").toString()
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }
    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            shrinkResources true
            // 有 keystore 就用它，没有就沿用 debug 签名（保持「不配密钥也能打包」）。
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            kotlin.srcDirs = ['src']
            resources.srcDirs = ['src']
            aidl.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
        test {
            java.srcDirs = ['test/java']
            kotlin.srcDirs = ['test/kotlin']
            resources.srcDirs = ['test/resources']
        }
        androidTest {
            java.srcDirs = ['androidTest/java']
            kotlin.srcDirs = ['androidTest/kotlin']
        }
        debug.setRoot('build-types/debug')
        release.setRoot('build-types/release')
    }
    lint {
        // 门禁：error 级问题直接让构建失败（CI 跑 :brailleback:lintDebug）。
        // 为什么以前是 false：MissingTranslation 曾以 error 级刷出 276 条，
        // 把它降级为 warning（见 brailleback/lint.xml），其余检查保持原样。
        abortOnError true
        checkReleaseBuilds false
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':client')
    implementation project(':service')
    // 移植的 TalkBack 屏幕盲文键盘（addon/ 下 6 个模块，含 liblouis native）。
    implementation project(':addon:brailleime')
    implementation project(':libraries:utils')
    implementation project(':libraries:compatutils')
    // 只用到 androidx.core 的 AccessibilityNodeInfoCompat。
    // 原 legacy-support-v4 会额外拖入 androidx.media 整包，已摘除。
    // 版本必须锁 1.9.0：这是 appcompat:1.6.1 / preference-ktx:1.2.1 传递解析出的最高版本，
    // 显式声明更高的（如 1.13.1）会把整个依赖图的 core 一起抬上去，实测反而 +0.87MB。
    implementation 'androidx.core:core:1.9.0'
    // 设置页框架迁移（step 1）：androidx.preference + appcompat
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    // Jetpack Compose：固定版本（本机离线缓存已有 1.7.6 / material3 1.3.1），
    // 不引 BOM，避免离线构建时 BOM 解析失败。
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.ui:ui:1.7.6'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.7.6'
    implementation 'androidx.compose.foundation:foundation:1.7.6'
    implementation 'androidx.compose.material:material-icons-core:1.7.6'
    implementation 'androidx.compose.material3:material3:1.3.1'
    debugImplementation 'androidx.compose.ui:ui-tooling:1.7.6'
    testImplementation 'junit:junit:4.13.2'
    // 虚拟时间验证定时器（空闲清屏 / 运动去抖 / 闪烁），不用真等三分钟。
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0'
    // 仪器测试：只做「真机/模拟器上真的能起来」的冒烟。版本锁在本机离线缓存已有的组合，
    // 不引 espresso / compose-ui-test（缓存里只有 1.10.2，与 Compose 1.7.6 不同版）。
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:core:1.5.0'
    // 真实触摸点击：设置分类是 Preference 行，标题 TextView 本身不可点击，
    // Espresso 的 click 会在「View is not clickable」上失败；UiAutomator 的 click
    // 打到行容器，和手指一致。版本来自阿里镜像拉取（见 tools/dependency-probe）。
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}

