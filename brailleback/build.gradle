// 平台配置（compileSdk / minSdk / targetSdk）来自约定插件，见 build-logic/。
plugins {
    id 'brailleback.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Version lives in the root gradle.properties only (see VersionCatalogTest).
// providers.gradleProperty() keeps configuration-cache compatibility.
def appVersionCode = providers.gradleProperty('appVersionCode').get().toInteger()
def appVersionName = providers.gradleProperty('appVersionName').get()

// 正式签名的 keystore 放在仓库根的 keystore.properties（不进版本库，见 .gitignore）。
// 文件不存在时，release 仍按原来的方式用 debug 签名，构建不会因为缺密钥而失败。
def keystorePropertiesFile = rootProject.file('keystore.properties')
def hasReleaseKey = keystorePropertiesFile.exists()
def keystoreProperties = new Properties()
if (hasReleaseKey) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    if (hasReleaseKey) {
        signingConfigs {
            release {
                storeFile = rootProject.file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
            }
        }
    }
    buildFeatures {
        buildConfig = true
        compose = true
    }
    namespace = 'com.googlecode.eyesfree.brailleback'

    defaultConfig {
        applicationId = "com.googlecode.eyesfree.brailleback"
        versionCode = appVersionCode
        versionName = appVersionName
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        // 诊断包专用：把日志级别硬编码进 APK，设置页与偏好项都改不动它。
        // 正常构建为 -1（不生效）；出诊断包用 -PdiagLogLevel=3（DEBUG）。
        buildConfigField "int", "DIAG_LOG_LEVEL",
                (project.findProperty("diagLogLevel") ?: "-1").toString()
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }
    buildTypes {
        debug {
            minifyEnabled = false
            shrinkResources = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled = true
            shrinkResources = true
            // 有 keystore 就用它，没有就沿用 debug 签名（保持「不配密钥也能打包」）。
            signingConfig = hasReleaseKey ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    // 源码布局已迁到 AGP 标准目录（src/main/java、src/main/res、src/main/assets、
    // src/main/AndroidManifest.xml、src/test、src/androidTest），这里不再需要任何覆写。
    lint {
        // 门禁：error 级问题直接让构建失败（CI 跑 :brailleback:lintDebug）。
        // 为什么以前是 false：MissingTranslation 曾以 error 级刷出 276 条，
        // 把它降级为 warning（见 brailleback/lint.xml），其余检查保持原样。
        abortOnError = true
        checkReleaseBuilds = false
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':client')
    implementation project(':service')
    // 移植的 TalkBack 屏幕盲文键盘（addon/ 下 6 个模块，含 liblouis native）。
    implementation project(':addon:brailleime')
    implementation project(':libraries:utils')
    implementation project(':libraries:compatutils')
    // 只用到 androidx.core 的 AccessibilityNodeInfoCompat。
    // 原 legacy-support-v4 会额外拖入 androidx.media 整包，已摘除。
    // 这里声明 1.9.0 只是「下限备忘」，实际解析结果不是它：`:brailleback:dependencies`
    // 显示 androidx.core:core:1.9.0 -> 1.13.1，是 Compose 迁移带进来的
    // activity-compose:1.9.3 传递抬上去的。真要降回 1.9.0 得同时处理 Compose 运行时。
    implementation libs.androidx.core
    // 设置页框架迁移：appcompat 保留给 AppCompat DayNight 主题；
    // androidx.preference 已随自定义键位页 Compose 化摘除（本模块不再有 Preference UI）。
    implementation libs.androidx.appcompat
    // Jetpack Compose：不引 BOM，逐个写死（见 libs.versions.toml）。
    implementation libs.androidx.activity.compose
    implementation libs.compose.ui
    implementation libs.compose.ui.tooling.preview
    implementation libs.compose.foundation
    implementation libs.compose.material.icons.core
    implementation libs.compose.material3
    debugImplementation libs.compose.ui.tooling
    // 主源码直接使用协程（界面层 lifecycleScope、服务桥接层的取消作用域），按「直接用就直接声明」写。
    implementation libs.kotlinx.coroutines.android
    testImplementation libs.junit
    // 虚拟时间验证定时器（空闲清屏 / 运动去抖 / 闪烁），不用真等三分钟。
    testImplementation libs.kotlinx.coroutines.test
    // 仪器测试：只做「真机/模拟器上真的能起来」的冒烟。版本锁在本机离线缓存已有的组合，
    // 不引 espresso / compose-ui-test（缓存里只有 1.10.2，与 Compose 1.7.6 不同版）。
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.core
    // 真实触摸点击：设置分类是 Preference 行，标题 TextView 本身不可点击，
    // Espresso 的 click 会在「View is not clickable」上失败；UiAutomator 的 click
    // 打到行容器，和手指一致。版本来自阿里镜像拉取（见 tools/dependency-probe）。
    androidTestImplementation libs.androidx.test.uiautomator
    // Compose 交互测试：createComposeRule 需要 ui-test-junit4；
    // ui-test-manifest 提供 createComposeRule 用的空 ComponentActivity（debug 包专用）。
    androidTestImplementation libs.compose.ui.test.junit4
    debugImplementation libs.compose.ui.test.manifest
}

