apply plugin: 'com.android.library'

android {
    compileSdk 35
    namespace 'com.google.android.accessibility.braille.common'

    defaultConfig {
        minSdk 23
        targetSdk 35
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            kotlin.srcDirs = ['src']
            res.srcDirs = ['res']
        }
        // main 的 java.srcDirs 是 'src'，会把 src/test 也吞进主源集，所以测试单独放 test/。
        test {
            java.srcDirs = ['test']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    api project(':addon:tbcompat')
    api project(':addon:brailleinterfaces')
    api project(':addon:brailletranslate')
    testImplementation 'junit:junit:4.13.2'
}
