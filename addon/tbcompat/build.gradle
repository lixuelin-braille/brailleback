// TalkBack utils 薄适配层：只提供 braille 子系统真正引用到的那部分 API，
// 内部转发到 BrailleBack 既有能力。刻意不引入 ML Kit / Compose / Wear / sonic。
plugins {
    id 'brailleback.android.library'
}

android {
    namespace = 'com.google.android.accessibility.utils'

    defaultConfig {
        // BuildVersionUtils.isSystemPreload() 读取这个字段；BrailleBack 是用户态安装包，恒为 False。
        buildConfigField "String", "IS_SYSTEM_PRELOAD", "\"False\""
        // 宿主 applicationId。盲文键盘的 IME 组件名依赖它，
        // 与 brailleback/build.gradle 的 applicationId 必须一致。
        buildConfigField "String", "HOST_APPLICATION_ID", "\"com.linxi.brailleback\""
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }
}

dependencies {
    api libs.androidx.annotation
    api libs.androidx.core
    api libs.androidx.appcompat
    api libs.androidx.preference.ktx
    api libs.material
    api libs.guava
    // BrailleUserPreferences 用 Gson 序列化"已添加的语言"列表。
    api libs.gson
    api libs.errorprone.annotations
    api libs.autovalue.annotations
    testImplementation libs.junit
}
