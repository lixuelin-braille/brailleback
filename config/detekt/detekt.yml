# detekt 自定义阈值：只在默认规则集之上覆盖「对现有代码明显过严」的几项。
# 用法（仓库根）：
#   .\gradlew.bat detektCheck      # 查 baseline 之外的新问题，有则构建失败
#   .\gradlew.bat detektBaseline   # 重新生成 baseline（改了大段老代码之后）
#
# 设计原则：baseline 冻结存量债务，这里只定义「新代码可以有多大」。
# 阈值比 detekt 默认（类内 11 个函数、方法 60 行、类 600 行）松，是因为现有代码
# 已经在默认阈值之上，卡太紧会让任何一次小改动都触发重排。

build:
  maxIssues: 0

config:
  validation: true
  warningsAsErrors: false

complexity:
  TooManyFunctions:
    active: true
    thresholdInFiles: 40
    thresholdInClasses: 30
    thresholdInInterfaces: 20
    thresholdInObjects: 30
    thresholdInEnums: 10
  LongMethod:
    active: true
    threshold: 100
  LargeClass:
    active: true
    threshold: 900
  CyclomaticComplexMethod:
    active: true
    threshold: 22
  LongParameterList:
    active: true
    functionThreshold: 9
    constructorThreshold: 9
  NestedBlockDepth:
    active: true
    threshold: 6
  ComplexCondition:
    active: true
    threshold: 5

style:
  # 现有代码里 MagicNumber 极多（盲文点阵、HID 常量、超时），这条对硬件代码意义不大。
  MagicNumber:
    active: false
  MaxLineLength:
    active: true
    maxLineLength: 160
  UnusedPrivateMember:
    active: true
  ReturnCount:
    active: true
    max: 6
  # 老代码大量使用 !!（280 处），这条会整片报，交给 baseline 冻结。
  ForbiddenComment:
    active: false

naming:
  # 移植代码沿用上游命名（BRF、HID 之类），不强制改。
  MatchingDeclarationName:
    active: false
  FunctionNaming:
    active: true
    ignoreAnnotated: ['Composable']

exceptions:
  TooGenericExceptionCaught:
    active: true
  SwallowedException:
    active: true
  InstanceOfCheckForException:
    active: true

potential-bugs:
  UnsafeCallOnNullableType:
    active: true
  LateinitUsage:
    active: true
