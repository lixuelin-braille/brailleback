apply plugin: 'com.android.library'

android {
    compileSdk 35
    namespace 'com.googlecode.eyesfree.utils'

    defaultConfig {
        minSdk 23
        targetSdk 35
        
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            kotlin.srcDirs = ['src']
            resources.srcDirs = ['src']
            aidl.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
        debug.setRoot('build-types/debug')
        release.setRoot('build-types/release')
    }

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-project.txt'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-project.txt'
        }
    }
}

dependencies {
    implementation project(':libraries:compatutils')
    // 用到 androidx.core 的 AccessibilityNodeInfoCompat（6 个文件：AccessibilityNodeInfoRef /
    // AccessibilityNodeInfoUtils / NodeFilter / NodeFocusFinder / TreeDebug / WebInterfaceUtils）。
    // 原 legacy-support-v4 会额外拖入 androidx.media 整包，已摘除。
    implementation 'androidx.core:core:1.9.0'
    testImplementation 'junit:junit:4.13.2'
}
