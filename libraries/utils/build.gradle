plugins {
    id 'brailleback.android.library'
}

android {
    namespace = 'com.googlecode.eyesfree.utils'

    buildTypes {
        debug {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-project.txt'
        }
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-project.txt'
        }
    }
}

dependencies {
    implementation project(':libraries:compatutils')
    // 用到 androidx.core 的 AccessibilityNodeInfoCompat（6 个文件：AccessibilityNodeInfoRef /
    // AccessibilityNodeInfoUtils / NodeFilter / NodeFocusFinder / TreeDebug / WebInterfaceUtils）。
    // 原 legacy-support-v4 会额外拖入 androidx.media 整包，已摘除。
    implementation libs.androidx.core
    // CustomLabelManager 的标签库任务改用协程（原 AsyncTask 子类族）。
    // 锁 1.9.0：Compose 1.7.6 传递的是 1.7.3，这里显式抬到 1.9.0 并保持全仓一套
// （1.7.3 里有 Dispatchers.Main 的 Looper 边界与 StateFlow 并发 emit 的已知问题）。
    implementation libs.kotlinx.coroutines.android
    // DataStore：默认偏好文件的唯一写源（见 SettingsStore）。用 api 而不是 implementation，
    // 因为 brailleback 与 service 两个模块都要能引用 SettingsStore 的类型（它实现 SharedPreferences）。
    api libs.androidx.datastore.preferences
    testImplementation libs.junit
}
